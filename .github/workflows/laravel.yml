name: Laravel Package Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Test Laravel ${{ matrix.laravel }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '9', php: '8.0' }
          - { laravel: '9', php: '8.1' }
          - { laravel: '9', php: '8.2' }
          - { laravel: '10', php: '8.1' }
          - { laravel: '10', php: '8.2' }
          - { laravel: '10', php: '8.3' }
          - { laravel: '11', php: '8.2' }
          - { laravel: '11', php: '8.3' }
          - { laravel: '11', php: '8.4' }
          - { laravel: '12', php: '8.2' }
          - { laravel: '12', php: '8.3' }
          - { laravel: '12', php: '8.4' }
          - { laravel: '12', php: '8.5' }
          - { laravel: '13', php: '8.3' }
          - { laravel: '13', php: '8.4' }
          - { laravel: '13', php: '8.5' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: mbstring, xml, ctype, fileinfo, dom, curl
          coverage: none

      # Older Laravel majors have published security advisories, which Composer
      # refuses to install by default. CI only checks compatibility, so allow them.
      - name: Install dependencies
        run: |
          composer config policy.advisories.block false
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Execute tests
        run: composer test
